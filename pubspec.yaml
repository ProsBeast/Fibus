name: fibus
description: "Smart bus departure app — know when to leave home."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_database: ^11.1.0
  firebase_messaging: ^15.1.0

  # Google Sign-In
  google_sign_in: ^6.3.0

  # Maps (OpenStreetMap)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location / GPS
  geolocator: ^13.0.2
  flutter_foreground_task: ^8.16.0

  # State Management
  provider: ^6.1.5

  # Navigation
  go_router: ^14.8.1

  # HTTP
  http: ^1.3.0

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled type (SIL Open Font License, see assets/fonts/OFL-*.txt).
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
